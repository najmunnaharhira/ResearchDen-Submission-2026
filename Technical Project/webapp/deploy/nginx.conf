# Nginx reverse proxy config for BanglishCheck (alternative to Caddy).
# Replace check.yourdomain.com, then on the VPS:
#   sudo cp nginx.conf /etc/nginx/sites-available/banglishcheck
#   sudo ln -s /etc/nginx/sites-available/banglishcheck /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d check.yourdomain.com   # issues + wires up TLS

server {
    listen 80;
    server_name check.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
